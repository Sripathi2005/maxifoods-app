version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: maxifoods_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: maxifoods
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maxifoods"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Web Server + Static Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxifoods_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: maxifoods
      SECRET_KEY: maxifoods-super-secret-jwt-key-2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
